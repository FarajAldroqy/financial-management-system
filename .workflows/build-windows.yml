name: Build Windows Application

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Required so the release step can create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executables
    runs-on: windows-2022

    env:
      GYP_MSVS_VERSION: '2022'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build web application with Vite
        run: npm run build:web

      - name: Package Windows Electron Application
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: '2022'

      # Only the top level of release/ holds distributable files. A recursive glob
      # also sweeps up release/win-unpacked/SallatAlkhair.exe, which is the raw
      # Electron binary and cannot run without its sibling resources/ directory --
      # downloading and running that one fails immediately.
      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Financial-System-Windows-x64
          path: release/*.exe
          if-no-files-found: error

      # Releases serve the raw .exe at a public URL for direct one-click download.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem -Path release -Filter *.exe | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "No .exe files found in release/ to publish" }
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Write-Host "Publishing $($assets.Count) asset(s) for $tag"
          gh release create $tag $assets `
            --title "منظومة إدارة مالية - $tag" `
            --generate-notes `
            --clobber
